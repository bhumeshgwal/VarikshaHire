<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - Login, Sign Up & Apply</title>
    <!-- Import Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #8b5cf6;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --input-border: #e5e7eb;
            --input-focus: #c7d2fe;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            padding: 40px 30px 20px;
        }

        .header h1 {
            color: var(--text-dark);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .tab-container {
            display: flex;
            padding: 0 30px;
            margin-bottom: 30px;
            position: relative;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-btn.active {
            color: var(--primary-color);
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 33.33%;
            background: var(--primary-color);
            border-radius: 3px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .forms-container {
            position: relative;
            padding: 0 30px 40px;
            min-height: 350px;
        }

        .form-section {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-dark);
            transition: all 0.3s ease;
            background: white;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--input-focus);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 100px;
        }

        /* Custom styling for file input */
        input[type="file"] {
            padding: 8px;
            background: #f9fafb;
            color: var(--text-light);
            font-size: 13px;
        }

        input[type="file"]::file-selector-button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            margin-right: 12px;
            transition: background 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--primary-hover);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--bg-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 13px;
            color: var(--primary-color);
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Success Message styling */
        .success-message {
            display: none;
            background: #ecfdf5;
            color: var(--success-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #a7f3d0;
        }

        /* VrikshaHire theme, shared with the React app */
        :root {
            --primary-color: #24543b;
            --primary-hover: #183c29;
            --secondary-color: #e9a83b;
            --text-dark: #17241d;
            --text-light: #718078;
            --bg-gradient: #f7f8f5;
            --card-bg: #ffffff;
            --input-border: #dfe6df;
            --input-focus: rgba(36, 84, 59, 0.12);
            --error-color: #a43d35;
            --success-color: #24613f;
        }

        * { font-family: 'Outfit', sans-serif; }

        body {
            align-items: flex-start;
            background: radial-gradient(ellipse at 85% 0%, rgba(233, 168, 59, 0.08), transparent 30rem), #f7f8f5;
            color: var(--text-dark);
            padding: 32px 16px;
        }

        .container {
            max-width: 460px;
            margin: auto;
            background: #fff;
            border: 1px solid #e5eae5;
            border-radius: 22px;
            box-shadow: 0 12px 32px rgba(28, 52, 37, 0.07);
            backdrop-filter: none;
        }

        .header { padding: 32px 30px 22px; }
        .header h1 { letter-spacing: -0.035em; }
        .header p { line-height: 1.55; }

        .tab-container {
            gap: 4px;
            padding: 4px 30px;
            margin-bottom: 24px;
        }

        .tab-btn {
            z-index: 1;
            padding: 10px 0;
            border-radius: 8px;
            transition: color 180ms ease, background 180ms ease;
        }

        .tab-btn.active { color: #183c29; font-weight: 600; }

        .tab-indicator {
            bottom: 4px;
            height: calc(100% - 8px);
            background: #edf4ef;
            border-radius: 8px;
            z-index: 0;
        }

        .forms-container { padding: 0 30px 32px; }
        .input-group { margin-bottom: 16px; }

        .input-group label {
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #43534a;
        }

        .input-field {
            min-height: 46px;
            padding: 10px 13px;
            border: 1px solid var(--input-border);
            border-radius: 11px;
            background: #fbfcfa;
            transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        textarea.input-field { min-height: 100px; }

        input[type="file"] { color: var(--text-light); }

        input[type="file"]::file-selector-button {
            background: var(--primary-color);
            border-radius: 8px;
            transition: background 180ms ease;
        }

        input[type="file"]::file-selector-button:hover { background: var(--primary-hover); }

        .submit-btn {
            min-height: 46px;
            padding: 12px;
            background: var(--primary-color);
            border-radius: 11px;
            box-shadow: none;
            transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 5px 14px rgba(36, 84, 59, 0.16);
            transform: translateY(-1px);
        }

        .forgot-password { color: var(--primary-color); }

        .success-message {
            color: var(--success-color);
            background: #eff8f1;
            border-color: #d3e9d9;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            body { padding: 16px 10px; }
            .container { border-radius: 18px; }
            .header { padding: 26px 20px 18px; }
            .tab-container { padding-right: 20px; padding-left: 20px; }
            .forms-container { padding-right: 20px; padding-left: 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="main-title">Welcome Back</h1>
            <p id="main-desc">Please enter your details to sign in.</p>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab(0)">Login</button>
            <button class="tab-btn" onclick="switchTab(1)">Sign Up</button>
            <button class="tab-btn" onclick="switchTab(2)">Apply</button>
            <div class="tab-indicator" id="indicator"></div>
        </div>

        <div class="forms-container">
            <form id="form-login" class="form-section active" onsubmit="handleSubmit(event, 'login')">
                <div class="success-message" id="msg-login">Login successful! Redirecting...</div>
                <div class="input-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="input-field" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <form id="form-signup" class="form-section" onsubmit="handleSubmit(event, 'signup')">
                <div class="success-message" id="msg-signup">Account created successfully!</div>
                <div class="input-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="input-field" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="input-field" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="input-field" placeholder="Create a strong password" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <form id="form-apply" class="form-section" onsubmit="handleSubmit(event, 'apply')">
                <div class="success-message" id="msg-apply">Application submitted successfully!</div>
                <div class="input-group">
                    <label for="apply-name">Full Name</label>
                    <input type="text" id="apply-name" class="input-field" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="apply-position">Position / Role</label>
                    <select id="apply-position" class="input-field" required>
                        <option value="" disabled selected>Select a position...</option>
                        <option value="developer">Software Developer</option>
                        <option value="designer">UI/UX Designer</option>
                        <option value="manager">Product Manager</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="apply-resume">Upload Resume (PDF)</label>
                    <input type="file" id="apply-resume" class="input-field" accept=".pdf" required>
                </div>
                <div class="input-group">
                    <label for="apply-cover">Why should we hire you?</label>
                    <textarea id="apply-cover" class="input-field" placeholder="Write a brief cover letter..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit Application</button>
            </form>
        </div>
    </div>

    <script>
        // Form Configuration Data
        const formData = [
            { id: 'form-login', title: 'Welcome Back', desc: 'Please enter your details to sign in.' },
            { id: 'form-signup', title: 'Create Account', desc: 'Join us today and get started.' },
            { id: 'form-apply', title: 'Apply Now', desc: 'Submit your details to join our team.' }
        ];

        function switchTab(tabIndex) {
            // Update Tab Styling
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((tab, index) => {
                if (index === tabIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // Move Indicator
            const indicator = document.getElementById('indicator');
            indicator.style.transform = `translateX(${tabIndex * 100}%)`;

            // Update Header Text
            document.getElementById('main-title').innerText = formData[tabIndex].title;
            document.getElementById('main-desc').innerText = formData[tabIndex].desc;

            // Switch Forms
            const forms = document.querySelectorAll('.form-section');
            forms.forEach((form, index) => {
                if (index === tabIndex) {
                    form.classList.add('active');
                    // Optional: clear forms and messages when switching
                    resetFormMessages();
                } else {
                    form.classList.remove('active');
                }
            });
        }

        // Handle Form Submissions (Mocking API requests)
        function handleSubmit(event, type) {
            event.preventDefault(); // Prevent page reload
            
            // Get the specific button inside the submitted form
            const form = event.target;
            const btn = form.querySelector('.submit-btn');
            const originalText = btn.innerText;

            // Show loading state
            btn.innerText = 'Processing...';
            btn.style.opacity = '0.8';
            btn.disabled = true;

            // Simulate network request (1.5 seconds)
            setTimeout(() => {
                // Show success message
                const msgBox = document.getElementById(`msg-${type}`);
                msgBox.style.display = 'block';
                
                // Reset button
                btn.innerText = originalText;
                btn.style.opacity = '1';
                btn.disabled = false;
                
                // Reset form fields
                form.reset();

                // Hide success message after 4 seconds
                setTimeout(() => {
                    msgBox.style.display = 'none';
                }, 4000);
            }, 1500);
        }

        // Helper function to hide messages when switching tabs
        function resetFormMessages() {
            const messages = document.querySelectorAll('.success-message');
            messages.forEach(msg => msg.style.display = 'none');
        }
    </script>
</body>
</html>
