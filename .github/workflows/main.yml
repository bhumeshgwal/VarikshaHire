name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vrikshahire-client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: vrikshahire-client
        run: npm ci

      - name: Build React app
        working-directory: vrikshahire-client
        run: npm run build

      - name: Sync Capacitor
        working-directory: vrikshahire-client
        run: npx cap sync android

      - name: Build APK
        working-directory: vrikshahire-client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VrikshaHire-APK
          path: vrikshahire-client/android/app/build/outputs/apk/debug/app-debug.apk
